<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'sha256-0z8QsXoCGp/dJeS31IMn+gYcgEHKcLq2emIoShzQYWA='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co; base-uri 'none'; form-action 'self'">
<title>Crust Cafe · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4e9dd;--bg2:#ecdac8;--ink:#2a1e18;--mute:#6e5d51;--line:rgba(42,30,24,.15);--card:#fbf5ee;--bad:#a63d2f;--serif:'Instrument Serif',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font:400 16px/1.5 var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2{font:400 2rem/1.1 var(--serif)}
input,button,textarea{font:inherit;color:inherit}
input,textarea{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
textarea{resize:vertical;min-height:100px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 22px;border-radius:99px;border:1px solid var(--ink);background:transparent;font-weight:500;cursor:pointer}
.btn.dark{background:var(--ink);color:#f7efe5}.btn.sm{min-height:40px;padding:8px 16px}.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth>div{width:min(420px,100%)}.auth form{display:grid;gap:14px;box-shadow:0 30px 60px -30px rgba(60,35,20,.4)}
.lbl{display:grid;gap:6px;font-size:.85rem;color:var(--mute)}
.lnk{justify-self:start;background:none;border:0;text-decoration:underline;font-size:.88rem;color:var(--mute);cursor:pointer}
.note{color:var(--mute);font-size:.9rem}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:rgba(244,233,221,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:400 1.5rem var(--serif)}.logo small{margin-left:8px;font:500 .68rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tabs{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{padding:15px 4px;border:0;background:none;font-weight:500;font-size:.85rem;color:var(--mute);cursor:pointer}
.tabs button[aria-current=true]{color:var(--ink);box-shadow:inset 0 2px var(--ink)}
.pane{max-width:860px;margin:0 auto;padding:22px 16px 110px;display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}.row.add{flex-wrap:wrap}.row.add input{flex:1 1 140px}
.it input[data-f$=price],.addItem input[name=price]{width:96px;flex:none}
.rs{color:var(--mute)}.cat{display:grid;gap:10px}.cat .head input:first-child{max-width:150px}
.icon{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.3rem;line-height:1;color:var(--bad);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bn{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.bn img{display:block;width:100%;aspect-ratio:16/7;object-fit:cover}.bn .icon{position:absolute;right:8px;top:8px}
.rv{display:grid;gap:6px;justify-items:start}.rv p{white-space:pre-wrap}
#toast{position:fixed;z-index:50;left:50%;top:14px;transform:translateX(-50%);max-width:92vw;padding:10px 18px;border-radius:99px;background:var(--ink);color:#fff;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}#toast.bad{background:var(--bad)}
@media(min-width:900px){.tabs{top:58px;right:auto;width:210px;grid-template-columns:1fr;grid-auto-rows:48px;align-content:start;gap:4px;padding:16px 10px;border-top:0;border-right:1px solid var(--line)}.tabs button{text-align:left;padding:0 16px;border-radius:12px}.tabs button[aria-current=true]{background:var(--bg2);box-shadow:none}#app main{margin-left:210px}.pane{padding-bottom:50px}}
</style></head><body>
<div id="toast" role="status" aria-live="polite"></div>
<main id="auth" class="auth"><div>
<form id="fLogin" class="card"><h1>Admin sign in</h1><p class="note">Crust Cafe dashboard</p>
<label class="lbl">Email<input name="email" type="email" autocomplete="username" required></label>
<label class="lbl">Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn dark">Sign in</button><button type="button" class="lnk" id="goForgot">Forgot password?</button></form>
<form id="fForgot" class="card" hidden><h1>Reset password</h1><p class="note">Enter your admin email and we’ll send a reset link.</p>
<label class="lbl">Email<input name="email" type="email" autocomplete="email" required></label>
<button class="btn dark">Send reset link</button><button type="button" class="lnk" id="goLogin">Back to sign in</button></form>
<form id="fReset" class="card" hidden><h1>New password</h1>
<label class="lbl">New password<input name="p" type="password" autocomplete="new-password" required></label>
<label class="lbl">Confirm password<input name="p2" type="password" autocomplete="new-password" required></label>
<p class="note">At least 10 characters, with letters and numbers.</p><button class="btn dark">Save password</button></form>
<p id="cfg" class="note" hidden>Setup needed: add your Supabase URL and anon key to config.js (see SETUP.md).</p>
</div></main>
<div id="app" hidden>
<header class="top"><span class="logo">Crust Cafe<small>Admin</small></span><button id="out" class="btn sm">Sign out</button></header>
<nav id="tabs" class="tabs"><button data-t="menu">Menu</button><button data-t="banners">Banners</button><button data-t="reviews">Reviews</button><button data-t="acct">Account</button></nav>
<main id="pane" class="pane"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script><script src="config.js"></script>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=window.CAFE||{};
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=''},3400)};
if(!C.url||!C.key||!window.supabase){$('#cfg').hidden=false;$$('#auth form').forEach(f=>{f.hidden=true});return}
const sb=supabase.createClient(C.url,C.key);
const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
const okPw=p=>p.length>=10&&/[a-z]/i.test(p)&&/\d/.test(p);
let cats=[],items=[],bans=[],revs=[],tab='menu',me='',ready=false,rec=/type=recovery/.test(location.hash),fails=0,lock=0,idle=0;
const pane=id=>['fLogin','fForgot','fReset'].forEach(f=>{$('#'+f).hidden=f!==id});
const bump=()=>{clearTimeout(idle);idle=setTimeout(()=>sb.auth.signOut(),20*60*1000)};
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{if(ready)bump()}));
const inp=(f,id,v,m,a)=>`<input data-f="${f}" data-id="${id}" value="${esc(v)}" maxlength="${m}" aria-label="${a}">`;
const R={
menu:()=>`<h2>Menu</h2><p class="note">Change a name or price and it saves when you leave the field.</p>
<form class="card row add" data-act="addCat"><input name="grp" list="grps" placeholder="Group (e.g. Snacks)" required maxlength="40"><input name="name" placeholder="Category (e.g. Pizza)" required maxlength="60"><button class="btn dark sm">Add category</button><datalist id="grps">${[...new Set(cats.map(c=>c.grp))].map(g=>`<option value="${esc(g)}">`).join('')}</datalist></form>
${cats.map(c=>`<article class="card cat"><div class="row head">${inp('categories.grp',c.id,c.grp,40,'Group')}${inp('categories.name',c.id,c.name,60,'Category')}<button class="icon" data-del="categories" data-id="${c.id}" aria-label="Delete category">×</button></div>
${items.filter(i=>i.category_id===c.id).map(i=>`<div class="row it">${inp('items.name',i.id,i.name,80,'Item name')}<span class="rs">₹</span><input data-f="items.price" data-id="${i.id}" type="number" min="0" max="99999" inputmode="numeric" value="${i.price}" aria-label="Price"><button class="icon" data-del="items" data-id="${i.id}" aria-label="Delete item">×</button></div>`).join('')}
<form class="row add addItem" data-act="addItem" data-c="${c.id}"><input name="name" placeholder="New item" required maxlength="80"><span class="rs">₹</span><input name="price" type="number" min="0" max="99999" inputmode="numeric" placeholder="Price" required><button class="btn dark sm">Add item</button></form></article>`).join('')}`,
banners:()=>`<h2>Banners</h2><p class="note">Up to 4 banners slide above “Our Story”. Best size 1600 × 700 px, with key text near the centre so phones show it well. ${bans.length} / 4 used.</p>
<div class="grid">${bans.map(b=>`<div class="bn"><img src="${esc(b.url)}" alt="Banner"><button class="icon" data-delbn="${b.id}" aria-label="Delete banner">×</button></div>`).join('')}</div>
<div class="card"><label class="lbl">Add a banner (JPG, PNG or WebP)<input type="file" id="up" accept="image/jpeg,image/png,image/webp" ${bans.length>=4?'disabled':''}></label></div>`,
reviews:()=>`<h2>Reviews</h2><form class="card" style="display:grid;gap:12px" data-act="addRev"><label class="lbl">Name<input name="name" required maxlength="60"></label><label class="lbl">Extra line (optional)<input name="meta" maxlength="80" placeholder="Local Guide · 14 reviews"></label><label class="lbl">Review<textarea name="body" required maxlength="600"></textarea></label><label class="lbl">Tag (optional)<input name="tag" maxlength="40" placeholder="Food: 5"></label><button class="btn dark">Add review</button></form>
${revs.map(r=>`<article class="card rv"><b>${esc(r.name)}</b><small class="note">${esc(r.meta||'')}</small><p>${esc(r.body)}</p>${r.tag?`<small class="note">${esc(r.tag)}</small>`:''}<button class="btn sm" data-del="reviews" data-id="${r.id}">Delete</button></article>`).join('')}`,
acct:()=>`<h2>Account</h2><p class="note">Signed in as <b>${esc(me)}</b></p><form class="card" style="display:grid;gap:12px" data-act="setPw"><label class="lbl">New password<input name="p" type="password" autocomplete="new-password" required></label><label class="lbl">Confirm password<input name="p2" type="password" autocomplete="new-password" required></label><p class="note">At least 10 characters, with letters and numbers.</p><button class="btn dark">Change password</button></form>
<div class="card" style="display:grid;gap:10px;justify-items:start"><b>Security</b><p class="note">You are signed out automatically after 20 minutes of inactivity.</p><button class="btn" data-out="all">Sign out of all devices</button></div>`};
function render(){$('#pane').innerHTML=R[tab]();$$('#tabs button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.t===tab)))}
async function load(){[cats,items,bans,revs]=await Promise.all([q(sb.from('categories').select('*').order('pos').order('id')),q(sb.from('items').select('*').order('pos').order('id')),q(sb.from('banners').select('*').order('id')),q(sb.from('reviews').select('*').order('id',{ascending:false}))]);render()}
const act=async(fn,msg)=>{try{await fn();if(msg)toast(msg)}catch(e){toast(e.message||'Something went wrong',1);try{await load()}catch{}}};
async function gate(session){
 if(rec)return;
 if(!session){ready=false;$('#app').hidden=true;$('#auth').hidden=false;pane('fLogin');return}
 if(ready)return;
 let admin=false;try{admin=await q(sb.rpc('is_admin'))}catch{}
 if(!admin){await sb.auth.signOut();toast('This account is not authorised.',1);return}
 ready=true;me=session.user.email;$('#auth').hidden=true;$('#app').hidden=false;bump();
 try{await load()}catch{toast('Could not load data. Check setup.',1)}}
sb.auth.onAuthStateChange((ev,s)=>{
 if(ev==='PASSWORD_RECOVERY'){rec=true;ready=false;$('#app').hidden=true;$('#auth').hidden=false;pane('fReset');return}
 setTimeout(()=>gate(s),0)});
async function setPw(e){e.preventDefault();const f=new FormData(e.target),p=f.get('p'),p2=f.get('p2');
 if(!okPw(p))return toast('Use 10+ characters with letters and numbers.',1);
 if(p!==p2)return toast('Passwords do not match.',1);
 const {error}=await sb.auth.updateUser({password:p});
 if(error)return toast('Could not update password: '+error.message,1);
 e.target.reset();toast('Password updated.');
 if(rec){rec=false;history.replaceState(null,'',location.pathname);const {data}=await sb.auth.getSession();gate(data.session)}}
$('#fReset').onsubmit=setPw;
$('#goForgot').onclick=()=>pane('fForgot');$('#goLogin').onclick=()=>pane('fLogin');
$('#fForgot').onsubmit=async e=>{e.preventDefault();const em=new FormData(e.target).get('email').trim();
 await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
 toast('If that email is registered, a reset link is on its way.');pane('fLogin')};
$('#fLogin').onsubmit=async e=>{e.preventDefault();
 if(Date.now()<lock)return toast('Too many attempts. Wait a minute and try again.',1);
 const f=new FormData(e.target),b=e.submitter;if(b)b.disabled=true;
 const {error}=await sb.auth.signInWithPassword({email:f.get('email').trim(),password:f.get('password')});
 if(b)b.disabled=false;
 if(error){if(++fails>=5){lock=Date.now()+60000;fails=0}toast('Invalid email or password.',1)}else{fails=0;e.target.reset()}};
$('#out').onclick=()=>sb.auth.signOut();
const A=$('#app');
A.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){tab=d.t;render();scrollTo(0,0)}
 else if(d.del){if(confirm('Delete this permanently?'))act(async()=>{await q(sb.from(d.del).delete().eq('id',d.id));await load()},'Deleted')}
 else if(d.delbn){const x=bans.find(v=>String(v.id)===d.delbn);if(x&&confirm('Delete this banner?'))act(async()=>{await sb.storage.from('banners').remove([x.path]);await q(sb.from('banners').delete().eq('id',x.id));await load()},'Banner deleted')}
 else if(d.out)sb.auth.signOut({scope:'global'})});
A.addEventListener('change',e=>{const t=e.target;
 if(t.id==='up')return upload(t);
 if(!t.dataset.f)return;
 const [tb,col]=t.dataset.f.split('.');let v=t.value.trim();
 if(col==='price'){v=parseInt(v,10);if(!(v>=0&&v<=99999)){toast('Enter a valid price.',1);return load()}}
 else if(!v){toast('This cannot be empty.',1);return load()}
 act(async()=>{await q(sb.from(tb).update({[col]:v}).eq('id',t.dataset.id));const o=(tb==='items'?items:cats).find(x=>String(x.id)===t.dataset.id);if(o)o[col]=v},'Saved')});
A.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=Object.fromEntries(new FormData(f)),a=f.dataset.act;
 if(a==='setPw')return setPw(e);
 act(async()=>{
  if(a==='addCat')await q(sb.from('categories').insert({grp:d.grp.trim(),name:d.name.trim(),pos:cats.length+1}));
  if(a==='addItem')await q(sb.from('items').insert({category_id:+f.dataset.c,name:d.name.trim(),price:parseInt(d.price,10),pos:items.filter(i=>String(i.category_id)===f.dataset.c).length+1}));
  if(a==='addRev')await q(sb.from('reviews').insert({name:d.name.trim(),meta:d.meta.trim()||null,body:d.body.trim(),tag:d.tag.trim()||null}));
  await load()},'Added')});
async function upload(el){const f=el.files[0];el.value='';if(!f)return;
 if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>15e6)return toast('Choose a JPG, PNG or WebP under 15 MB.',1);
 if(bans.length>=4)return toast('Maximum 4 banners. Delete one first.',1);
 toast('Uploading…');
 act(async()=>{
  const bm=await createImageBitmap(f),w=Math.min(1600,bm.width),h=Math.round(bm.height*w/bm.width),cv=document.createElement('canvas');
  cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(bm,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82)),path=crypto.randomUUID()+'.jpg';
  const u=await sb.storage.from('banners').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;
  const url=sb.storage.from('banners').getPublicUrl(path).data.publicUrl;
  try{await q(sb.from('banners').insert({path,url}))}catch(er){await sb.storage.from('banners').remove([path]);throw er}
  await load()},'Banner added')}
})();</script></body></html>
